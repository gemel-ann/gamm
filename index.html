
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8e5ed">
  <meta name="description" content="Explore Gemel Ann Macaraeg's interactive virtual assistant portfolio, experience, skills, and projects.">
  <title>Gemel's iPad | Virtual Assistant Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #f5d5e1;
      --pink-dark: #d78da9;
      --rose: #b96d8b;
      --cream: #fff9f7;
      --ink: #49333e;
      --muted: #886d7a;
      --glass: rgba(255, 249, 252, 0.78);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 15%, #fff7f6 0, transparent 35%),
        radial-gradient(ellipse at 90% 85%, #e8b5cb 0, transparent 35%),
        linear-gradient(140deg, #f9e7ed, #edc6d7 55%, #f8e9e7);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    .ipad {
      position: relative;
      width: min(100%, 1000px);
      min-height: 680px;
      padding: 14px;
      border-radius: 38px;
      background: linear-gradient(145deg, #fffdfd, #cda5b6 55%, #fff5f8);
      box-shadow: 0 35px 90px #86536c35, inset 0 0 0 2px #ffffffb8;
    }

    .screen {
      position: relative;
      min-height: 652px;
      height: min(78vh, 760px);
      overflow: hidden;
      border-radius: 27px;
      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.65) 1.2px,
          transparent 1.8px
        ) 0 0 / 30px 30px,
        radial-gradient(
          ellipse at 12% 78%,
          #fff2f8 0,
          transparent 42%
        ),
        radial-gradient(
          ellipse at 88% 18%,
          #f9cadd 0,
          transparent 44%
        ),
        linear-gradient(
          145deg,
          #fff0f6 0%,
          #f3cadd 48%,
          #fbe9f0 100%
        );
    }

    .status {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 27px;
      font-size: 12px;
      font-weight: 700;
      position: relative;
      z-index: 5;
    }

    .status-right { display: flex; align-items: center; gap: 9px; }

    .battery {
      width: 22px;
      height: 11px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      padding: 2px;
      position: relative;
    }

    .battery::before {
      content: "";
      display: block;
      height: 100%;
      width: 75%;
      border-radius: 1px;
      background: currentColor;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: currentColor;
      border-radius: 0 2px 2px 0;
    }

    .home {
      padding: 10px 28px 90px;
      height: calc(100% - 42px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #d79bb4 transparent;
    }

    .welcome { text-align: center; padding: 18px 0 27px; }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
      color: var(--rose);
    }

    h1, h2, h3, p { margin-top: 0; }

    .welcome h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(35px, 6vw, 55px);
      margin: 10px 0 7px;
      letter-spacing: -1.5px;
    }

    .welcome p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 0;
    }

    .heart { color: #c66f95; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 25px 12px;
      max-width: 630px;
      margin: 0 auto;
    }

    .app {
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
      transition: transform .2s ease;
    }

    .app:hover { transform: translateY(-5px); }
    .app:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid #a54e76;
      outline-offset: 4px;
    }

    
    .app-icon {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: clamp(57px, 8vw, 76px);
      aspect-ratio: 1;
      border-radius: 23px;
      display: grid;
      place-items: center;
      font-size: 31px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 9px 18px rgba(160, 78, 116, 0.18),
        inset 0 2px 3px rgba(255, 255, 255, 0.95),
        inset 0 -4px 8px rgba(192, 105, 145, 0.10);
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    /* Glossy highlight */
    .app-icon::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.82) 0%,
        rgba(255, 255, 255, 0.24) 32%,
        transparent 58%
      );
      pointer-events: none;
    }
    
    /* Coquette pink palette */
    .app:nth-child(6n + 1) .app-icon {
      background: linear-gradient(145deg, #fff8fb, #f2b8d0);
    }

    .app:nth-child(6n + 2) .app-icon {
      background: linear-gradient(145deg, #fff6fa, #e9a9c5);
    }

    .app:nth-child(6n + 3) .app-icon {
      background: linear-gradient(145deg, #fff7fc, #e3c2e6);
    }

    .app:nth-child(6n + 4) .app-icon {
      background: linear-gradient(145deg, #fffafd, #f0c6dc);
    }

    .app:nth-child(6n + 5) .app-icon {
      background: linear-gradient(145deg, #fffdf8, #f4d5df);
    }

    .app:nth-child(6n) .app-icon {
      background: linear-gradient(145deg, #fff5f8, #e9a5bd);
    }

    .app:hover .app-icon {
      box-shadow:
        0 12px 24px rgba(160, 78, 116, 0.24),
        inset 0 2px 4px rgba(255, 255, 255, 1);
      transform: translateY(-2px) rotate(-2deg);
    }


    .dock button {
      background: linear-gradient(145deg, #fffafd, #f1d0df);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 2px #ffffff, 0 3px 8px #a45d7b18;
    }

    .dock button:hover {
      background: linear-gradient(145deg, #ffffff, #eabbd0);
      transform: translateY(-4px) scale(1.04);
    }

    .app-label {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
    }

    .signature {
      margin-top: 26px;
      text-align: center;
      color: #92677b;
      font-size: 11px;
    }

    .dock {
      position: absolute;
      z-index: 7;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 249, 252, .68);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid #ffffff9c;
      border-radius: 23px;
      box-shadow: 0 8px 24px #85506a1b;
    }

    .dock button {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 25px;
      width: 43px;
      height: 43px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      transition: background .2s, transform .2s;
    }

    .dock button:hover { background: #ffffffb8; transform: translateY(-3px); }

    .app-window {
      position: absolute;
      z-index: 10;
      inset: 53px 25px 88px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid #ffffffd1;
      border-radius: 23px;
      box-shadow: 0 15px 55px #70465b24;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: openApp .25s ease;
    }

    .app-window.active { display: flex; }

    @keyframes openApp {
      from { opacity: 0; transform: scale(.97) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .window-bar {
      flex-shrink: 0;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 19px;
      border-bottom: 1px solid #d8b8c628;
      background: #fffafcb0;
    }

    .window-title { font-weight: 700; font-size: 14px; }

    .window-controls { display: flex; gap: 7px; }

    .control {
      width: 29px;
      height: 29px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: #f0dce5;
      font-size: 15px;
    }

    .control.close { background: #e9b0c5; }

    .window-content {
      padding: 25px clamp(18px, 4vw, 39px);
      overflow-y: auto;
      line-height: 1.75;
      font-size: 14px;
    }

    .window-content h2 {
      font-family: "Playfair Display", serif;
      font-size: clamp(27px, 4vw, 36px);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .window-content h3 { font-size: 15px; margin-bottom: 5px; }
    .window-content p { color: #765c69; }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      background: #f5e1e9;
      border: 1px solid #edcbd9;
      border-radius: 20px;
      font-size: 11px;
      margin: 3px 3px 3px 0;
      color: #88546c;
      font-weight: 600;
    }

    .content-card {
      padding: 17px 18px;
      border-radius: 16px;
      background: #fffafbd9;
      border: 1px solid #efdce4;
      margin: 13px 0;
    }

    .content-card p { margin-bottom: 0; }
    .date { font-size: 11px; color: #ad7790; font-weight: 700; }

    .action-link {
      display: inline-block;
      text-decoration: none;
      background: #bc718f;
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      margin: 5px 5px 5px 0;
      transition: background .2s;
    }

    .action-link:hover { background: #9e5675; }

    .home-button {
      position: absolute;
      z-index: 15;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #ffffffb0;
      background: #f8e6ed;
      box-shadow: inset 0 0 0 1px #d9a8bc;
      cursor: pointer;
    }

    .home-button:hover { background: white; }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #9d7888;
      padding: 8px 0;
    }

    @media (min-width: 700px) {
      .app-grid { grid-template-columns: repeat(4, 1fr); }
      .home { padding-top: 20px; }
    }

    @media (max-width: 540px) {
      body { padding: 7px; }
      .ipad { padding: 7px; border-radius: 26px; }
      .screen { min-height: min(790px, 94svh); height: 90svh; border-radius: 21px; }
      .status { padding: 0 17px; }
      .home { padding: 12px 13px 85px; }
      .welcome { padding: 24px 0 30px; }
      .app-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 23px 5px; }
      .app-icon { border-radius: 19px; }
      .app-window { inset: 48px 9px 77px; border-radius: 18px; }
      .window-content { padding: 21px 17px; }
      .dock { bottom: 16px; gap: 7px; padding: 8px 10px; }
      .dock button { width: 38px; height: 38px; font-size: 22px; }
      .home-button { bottom: 1px; width: 32px; height: 32px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

          <div class="content-card"><h3>Portfolio website</h3><p>You're already here! Feel free to explore the apps and learn more about my background.</p></div>
          <div class="content-card"><h3>GitHub</h3><p>Explore my portfolio website source code.</p><a class="action-link" href="https://github.com/gemel-ann/gemel-ann.github.io" target="_blank" rel="noopener">View repository ↗</a></div>
        `
      }
    };

    const homeScreen = document.getElementById("homeScreen");
    const appWindow = document.getElementById("appWindow");
    const windowTitle = document.getElementById("windowTitle");
    const windowContent = document.getElementById("windowContent");

    function openApp(appName) {
      const app = apps[appName];
      if (!app) return;

      windowTitle.textContent = app.title;
      windowContent.innerHTML = app.html;
      homeScreen.hidden = true;
      appWindow.classList.add("active");
      appWindow.setAttribute("aria-hidden", "false");
      windowContent.scrollTop = 0;
      windowContent.focus();
    }

    function goHome() {
      appWindow.classList.remove("active");
      appWindow.setAttribute("aria-hidden", "true");
      homeScreen.hidden = false;
    }

    document.querySelectorAll("[data-app]").forEach(button => {
      button.addEventListener("click", () => openApp(button.dataset.app));
    });

    document.getElementById("homeButton").addEventListener("click", goHome);
    document.getElementById("closeButton").addEventListener("click", goHome);
    document.getElementById("minimizeButton").addEventListener("click", goHome);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") goHome();
    });

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    }

    updateClock();
    setInterval(updateClock, 30000);
  </script>
</body>
</html>
